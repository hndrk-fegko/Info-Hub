name: Build deploy ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'

permissions:
  contents: read

jobs:
  build-deploy-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Build deploy ZIP
        id: build
        run: |
          chmod +x scripts/build-deploy-zip.sh
          build_output="$(scripts/build-deploy-zip.sh)"
          printf '%s\n' "$build_output"

          artifact_name="$(printf '%s\n' "$build_output" | awk -F= '/^artifact_name=/{print $2}')"
          artifact_path="$(printf '%s\n' "$build_output" | awk -F= '/^artifact_path=/{print $2}')"

          if [ -z "$artifact_name" ] || [ -z "$artifact_path" ]; then
            echo "Build script did not return artifact metadata." >&2
            exit 1
          fi

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error
